name: Release

# The binaries are built elsewhere and arrive here as a branch named
# incoming/<tag> with the packages in a folder `incoming`. This checks
# them against their checksums, publishes them as the release <tag>, and
# removes the branch.
on:
  push:
    branches: ["incoming/**"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${GITHUB_REF_NAME#incoming/}
          case "$tag" in
            v[0-9]*) ;;
            *) echo "Not a version: $tag"; exit 1 ;;
          esac
          cd incoming
          sha256sum -c SHA256SUMS
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" curd-* SHA256SUMS --clobber
          else
            gh release create "$tag" curd-* SHA256SUMS --target main --title "$tag" --notes-file notes.md
          fi
      - name: Remove the branch
        if: always()
        run: git push origin --delete "$GITHUB_REF_NAME"
